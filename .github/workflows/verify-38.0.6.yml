name: experimental-browser-acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: acceptance-${{ matrix.os }}-node${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax-check acceptance harness
        run: node --check scripts/browser-acceptance-lib.mjs
      - name: Run acceptance unit regressions
        run: node --test tests/browser-acceptance-v38.test.js
      - name: Run ten real MV3 load cycles
        env:
          NOLANE_ACCEPTANCE_ATTEMPTS: '10'
        run: node ci/run-browser-acceptance-probe.mjs

  mv3-worker-restart:
    name: mv3-worker-restart-${{ matrix.os }}-node22
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check worker lifecycle probe
        run: node --check ci/mv3-reload-probe.mjs
      - name: Terminate and reacquire MV3 worker five times
        env:
          NOLANE_MV3_RESTART_ROUNDS: '5'
        run: node ci/mv3-reload-probe.mjs

  browser-channels:
    name: channel-${{ matrix.channel }}-${{ matrix.os }}-node22
    strategy:
      fail-fast: false
      matrix:
        # Downloaded Chrome-for-Testing on GitHub-hosted macOS 26 Intel currently crashes child processes
        # with MachPort rendezvous errors. macOS remains gated by the installed-Chrome baseline jobs above;
        # downloaded stable/beta/dev channels are gated on Ubuntu + Windows and separately diagnosed below.
        os: [ubuntu-latest, windows-latest]
        channel: [stable, beta, dev]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Chrome channel
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
        with:
          chrome-version: ${{ matrix.channel }}
      - name: Show exact Chrome channel version on Windows without launching Chrome
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          $version = (Get-Item $env:CHROME_PATH).VersionInfo.ProductVersion
          Write-Host "Google Chrome for Testing $version"
      - name: Show exact Chrome channel version on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: '"$CHROME_PATH" --version'
      - name: Prepare Linux Chrome-for-Testing wrapper for hosted CI sandbox constraints
        if: runner.os == 'Linux'
        shell: bash
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          WRAPPER="$RUNNER_TEMP/nolane-chrome-no-sandbox"
          printf '#!/usr/bin/env bash\nexec "%s" --no-sandbox "$@"\n' "$CHROME_PATH" > "$WRAPPER"
          chmod +x "$WRAPPER"
          echo "NOLANE_CHANNEL_CHROME=$WRAPPER" >> "$GITHUB_ENV"
      - name: Use channel Chrome directly on Windows
        if: runner.os == 'Windows'
        shell: bash
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: echo "NOLANE_CHANNEL_CHROME=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Run five real MV3 load cycles on channel
        env:
          NOLANE_CHROMIUM_PATH: ${{ env.NOLANE_CHANNEL_CHROME }}
          NOLANE_ACCEPTANCE_ATTEMPTS: '5'
        run: node ci/run-browser-acceptance-probe.mjs
      - name: Restart and reacquire worker ten times on channel
        env:
          NOLANE_CHROMIUM_PATH: ${{ env.NOLANE_CHANNEL_CHROME }}
          NOLANE_MV3_RESTART_ROUNDS: '10'
        run: node ci/mv3-reload-probe.mjs

  macos-cft-diagnostic:
    name: macos-cft-diagnostic-${{ matrix.channel }}-node22
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta, dev]
    runs-on: macos-26-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run diagnostic classifier unit tests
        run: node --test tests/macos-cft-diagnostic.test.mjs
      - name: Install pinned Chrome-for-Testing channel
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
        with:
          chrome-version: ${{ matrix.channel }}
      - name: Show exact Chrome-for-Testing version
        shell: bash
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: '"$CHROME_PATH" --version'
      - name: Prepare CI-only no-sandbox wrapper
        shell: bash
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          WRAPPER="$RUNNER_TEMP/nolane-macos-cft-no-sandbox"
          printf '#!/usr/bin/env bash\nexec "%s" --no-sandbox "$@"\n' "$CHROME_PATH" > "$WRAPPER"
          chmod +x "$WRAPPER"
          echo "NOLANE_MACOS_CFT_CHROME=$WRAPPER" >> "$GITHUB_ENV"
      - name: Probe macOS CFT and fail closed on unknown signatures
        env:
          NOLANE_CHROMIUM_PATH: ${{ env.NOLANE_MACOS_CFT_CHROME }}
        run: node ci/run-macos-cft-diagnostic.mjs

  stress:
    name: stress-${{ matrix.os }}-node22
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stress thirty fresh Chrome MV3 load cycles
        env:
          NOLANE_ACCEPTANCE_ATTEMPTS: '30'
        run: node ci/run-browser-acceptance-probe.mjs
      - name: Stress fifty worker terminate/reacquire generations
        env:
          NOLANE_MV3_RESTART_ROUNDS: '50'
        run: node ci/mv3-reload-probe.mjs
