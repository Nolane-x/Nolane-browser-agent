name: experimental-browser-acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acceptance:
    name: acceptance-${{ matrix.os }}-node${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax-check acceptance harness
        run: node --check scripts/browser-acceptance-lib.mjs
      - name: Run acceptance unit regressions
        run: node --test tests/browser-acceptance-v38.test.js
      - name: Run repeated real MV3 load cycles
        run: node ci/run-browser-acceptance-probe.mjs

  mv3-reload:
    name: mv3-reload-${{ matrix.os }}-node22
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check reload probe
        run: node --check ci/mv3-reload-probe.mjs
      - name: Reload extension and reacquire MV3 worker five times
        run: node ci/mv3-reload-probe.mjs
